name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"

env:
  SWEEP_SEEDS: 256

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # a run takes about 15 minutes, so a hung test fails the job well short of the runner's 6 hours
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # steady locks every page it maps, thread stacks too, which a runner's default memlock limit can't hold
      - run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo prlimit --pid $$ --memlock=unlimited:unlimited; fi
          cargo xtask ci

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # each night starts where the last one ended, so the sweep covers new seeds
      - run: cargo xtask sweep "$SWEEP_SEEDS" "$(( $(date +%s) / 86400 * SWEEP_SEEDS ))"
