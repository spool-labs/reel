name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Split across runners so a hang costs one shard's timeout, not an hour, and the
  # suite's wall time is its slowest shard.
  test:
    name: test (linux, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [workspace, lib, integration-0, integration-1, differential]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
      # A test that writes real files honours TMPDIR, and /tmp on a runner is not
      # promised to be a disk. RUNNER_TEMP is.
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # crash_points and differential have their own job or shard, so the integration
      # shards split every other target between them. The list comes from cargo rather
      # than from here, so a test file added later is picked up without touching this
      # file; sorted so the split is deterministic.
      - name: run this shard
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            workspace)
              cargo test --workspace --exclude tape-reel --no-fail-fast
              ;;
            lib)
              cargo test -p tape-reel --lib --no-fail-fast \
                -- --skip callers_spread_across_the_shards
              # The one lib test that is not parallel-safe: it reads a process-wide
              # shard counter and assumes its increments are consecutive, so anything
              # else touching the async door beside it can red it. Run on its own.
              cargo test -p tape-reel --lib -- --exact --test-threads=1 \
                io::uring_backend::tests::callers_spread_across_the_shards
              ;;
            integration-*)
              part="${{ matrix.shard }}"
              part="${part#integration-}"
              mapfile -t names < <(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.name == "tape-reel") | .targets[]
                         | select(any(.kind[]; . == "test")) | .name' \
                | grep -vx -e crash_points -e differential | sort)
              selected=()
              for i in "${!names[@]}"; do
                if (( i % 2 == part )); then selected+=(--test "${names[$i]}"); fi
              done
              echo "running ${#selected[@]} of ${#names[@]} targets: ${selected[*]}"
              test "${#selected[@]}" -gt 0
              cargo test -p tape-reel "${selected[@]}" --no-fail-fast
              ;;
            differential)
              # Serial because the paged handover guards are only mostly
              # deterministic. The fixture flushes before it asks, so the sealer no
              # longer decides the answer, but a machine with most of its cores taken
              # can still run one of them out of its bound: 8 of 10 parallel runs
              # green under that load against 10 of 10 serial.
              cargo test -p tape-reel --test differential -- --test-threads=1
              ;;
          esac

  crash-points:
    name: crash points
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Its own job because it is three quarters of the suite's runtime on its own, and
      # in debug like the rest because optimizing it measured no faster: what it spends
      # its time on is the crash enumeration, not the code under it.
      - run: cargo test -p tape-reel --test crash_points

  macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets
      # The lib suites only. What this proves is that the portable half builds and
      # passes off Linux; the io assertions compile away here either way.
      - run: cargo test --workspace --lib

  examples:
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Each example checks its own claims, so a nonzero exit is a claim that stopped
      # being true. The list is the README's list.
      - name: run every example
        run: |
          set -euo pipefail
          for example in basic follower servo async_doors volumes cohorts simulated_crash checkpoint; do
            echo "::group::$example"
            cargo run --example "$example"
            echo "::endgroup::"
          done

  msrv:
    name: msrv 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What a consumer compiles, which is the lib and no test target: the dev
      # dependencies carry their own minimums and none of them is this crate's promise.
      - run: cargo check --workspace --all-features

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features sim"
          - "--no-default-features --features rendezvous"
          - "--no-default-features --features serde"
          - "--all-features"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The library alone. reel depends on itself as a dev-dependency with sim,
      # rendezvous and serde on, so anything that builds a test target sees every
      # feature and never sees the set a consumer links.
      - run: cargo clippy -p tape-reel --lib ${{ matrix.features }} -- -D warnings
