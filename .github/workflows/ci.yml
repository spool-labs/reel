name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A test that writes real files honours TMPDIR, and /tmp on a runner is not
      # promised to be a disk. RUNNER_TEMP is.
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: the other crates
        run: cargo test --workspace --exclude reel --no-fail-fast

      # crash_points and differential have their own job or step, so this run is every
      # other target. The list comes from cargo rather than from here, so a test file
      # added later is picked up without touching this file.
      - name: reel, less the binaries run on their own
        run: |
          set -euo pipefail
          mapfile -t names < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "reel") | .targets[]
                     | select(any(.kind[]; . == "test")) | .name' \
            | grep -vx -e crash_points -e differential)
          selected=()
          for name in "${names[@]}"; do selected+=(--test "$name"); done
          echo "running ${#names[@]} test targets: ${names[*]}"
          cargo test -p reel --lib "${selected[@]}" --no-fail-fast \
            -- --skip callers_spread_across_the_shards

      # The one lib test that is not parallel-safe: it reads a process-wide shard
      # counter and assumes its increments are consecutive, so anything else touching
      # the async door beside it can red it. Skipped above, run here on its own.
      - name: the shard counter test, alone
        run: cargo test -p reel --lib -- --exact --test-threads=1 io::uring_backend::tests::callers_spread_across_the_shards

      # Serial because the paged handover guards are only mostly deterministic. The
      # fixture flushes before it asks, so the sealer no longer decides the answer, but
      # a machine with most of its cores taken can still run one of them out of its
      # bound: 8 of 10 parallel runs green under that load against 10 of 10 serial.
      - name: differential, one test at a time
        run: cargo test -p reel --test differential -- --test-threads=1

  crash-points:
    name: crash points
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Its own job because it is three quarters of the suite's runtime on its own, and
      # in debug like the rest because optimizing it measured no faster: what it spends
      # its time on is the crash enumeration, not the code under it.
      - run: cargo test -p reel --test crash_points

  macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets
      # The lib suites only. What this proves is that the portable half builds and
      # passes off Linux; the io assertions compile away here either way.
      - run: cargo test --workspace --lib

  examples:
    name: examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: temp on the runner's own disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Each example checks its own claims, so a nonzero exit is a claim that stopped
      # being true. The list is the README's list.
      - name: run every example
        run: |
          set -euo pipefail
          for example in basic follower servo async_doors volumes cohorts simulated_crash checkpoint; do
            echo "::group::$example"
            cargo run --example "$example"
            echo "::endgroup::"
          done

  msrv:
    name: msrv 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # What a consumer compiles, which is the lib and no test target: the dev
      # dependencies carry their own minimums and none of them is this crate's promise.
      - run: cargo check --workspace --all-features

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features sim"
          - "--no-default-features --features rendezvous"
          - "--no-default-features --features serde"
          - "--all-features"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The library alone. reel depends on itself as a dev-dependency with sim,
      # rendezvous and serde on, so anything that builds a test target sees every
      # feature and never sees the set a consumer links.
      - run: cargo clippy -p reel --lib ${{ matrix.features }} -- -D warnings
