name: models

# Miri and the fuzzers are too slow for a pull request. They ask whether the unsafe code
# holds and whether an input nobody thought of breaks it. Weekly, and on demand.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Miri interprets, so anything that opens a file or submits to a ring is out of
      # reach: posix_backend's tests are already cfg'd off under it, as is every
      # differential cell. Named modules rather than the whole lib because two more
      # things are out of reach than the cfgs say. `format::footer`, `format::record`
      # and `format::block` checksum, and crc-fast dispatches to a SIMD intrinsic the
      # interpreter has no shim for; `index::map` interprets too slowly to bound.
      - name: the byte-level modules
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo miri test -p tape-reel --lib -- \
            format::column format::filter format::prefix \
            index::tbtreemap

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - format_parsers
          - codec_roundtrip
          - store_ops
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      # Cached with the rest of ~/.cargo/bin, so only the first run of a week pays it.
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # The seeds are the starting point rather than an empty directory, so a slot is
      # spent past the gates a cold run would spend it finding. They travel as one
      # archive per target and are unpacked into the directory libFuzzer reads.
      - name: seeds
        run: python3 seeds.py unpack ${{ matrix.target }}
        working-directory: fuzz
      # Each target runs alone: fail-fast off, because one crashing target says nothing
      # about the other two and stopping them would throw away the run.
      - name: ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=1200 -rss_limit_mb=4096
        working-directory: fuzz
      # libFuzzer prints the failing unit as base64 before it dies, so the log already
      # carries the reproducer. This puts the bytes beside it in a form that can be
      # pasted straight back into a test.
      - name: the units that failed
        if: failure()
        run: |
          for unit in fuzz/artifacts/${{ matrix.target }}/*; do
            [ -e "$unit" ] || continue
            echo "== $unit"
            xxd "$unit"
          done
