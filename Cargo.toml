[workspace]
resolver = "2"
members = ["crates/*"]

# The fuzz targets build against libfuzzer on nightly and are not part of a stable
# build of the store, so they stay out of the workspace and off the pull request path.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
license = "Apache-2.0"
homepage = "https://tape.network"
repository = "https://github.com/spool-labs/reel"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
reel = { package = "tape-reel", path = "crates/reel" }
# Versioned because the published engine depends on it: a bare path dependency
# is a publish error. The mock is private and needs only its workspace path.
reel-core = { package = "tape-reel-core", path = "crates/reel-core", version = "0.2.0" }
reel-mock = { package = "tape-reel-mock", path = "crates/reel-mock" }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc-fast = "1.10"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
libc = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
tracing = "0.1"
tempfile = "3.10"
wincode = "0.1"
