[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://tape.network"
repository = "https://github.com/spool-labs/reel"

[workspace.dependencies]
libc = "0.2"
lz4-sys = "1"
reel = { package = "tape-reel", path = "crates/reel", version = "0.4.0" }
reel-api = { package = "tape-reel-core", path = "crates/reel-api", version = "0.4.0" }
reel-sim = { package = "tape-reel-sim", path = "crates/reel-sim" }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
expect_used = "deny"
panic = "deny"

# the CI's test builds: optimized, with every check a debug build makes, so the sims run about fifteen times faster
[profile.ci]
inherits = "dev"
opt-level = 2
