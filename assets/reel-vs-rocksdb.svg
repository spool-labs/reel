<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="256" viewBox="0 0 1040 256" role="img" aria-labelledby="title desc">
  <title id="title">reel, RocksDB, fjall, LMDB and redb on four measures, relative to RocksDB</title>
  <desc id="desc">Relative to RocksDB at 1x. Reads and writes: reel 3.7x, fjall 0.40x, LMDB 0.21x, redb 0.21x. Bulk load: reel 1.8x, fjall 0.48x, LMDB 0.06x, redb 0.05x. Write amplification, lower is better: reel 0.63x, fjall 1.2x, LMDB 15x, redb 16x. Peak memory, lower is better: reel 0.74x, fjall 1.1x, LMDB 0.79x, redb 1.1x.</desc>
  <style>
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ink { fill: #13171c; }
    .title { font-size: 14px; font-weight: 500; fill-opacity: 0.92; }
    .note { font-size: 12px; fill-opacity: 0.55; }
    .name { font-size: 13px; fill-opacity: 0.65; }
    .times { font-size: 12.5px; fill-opacity: 0.6; }
    .lead { fill-opacity: 0.92; }
    .reel { fill: #fe7d28; }
    .other { fill: #13171c; fill-opacity: 0.25; }
    .base { stroke: #13171c; stroke-opacity: 0.18; }
  </style>
  <rect width="1040" height="256" rx="16" fill="#fffdfb"/>

  <g class="mono ink" text-anchor="end">
    <text class="name lead" x="88" y="92.5">reel</text>
    <text class="name" x="88" y="118.5">RocksDB</text>
    <text class="name" x="88" y="144.5">fjall</text>
    <text class="name" x="88" y="170.5">LMDB</text>
    <text class="name" x="88" y="196.5">redb</text>
  </g>

  <g>
    <text class="mono ink title" x="98" y="40">Reads and writes</text>
    <text class="sans ink note" x="98" y="60">warm · higher is better</text>
    <line class="base" x1="98.5" y1="76" x2="98.5" y2="204"/>
    <rect class="reel" x="98" y="80" width="166" height="16"/>
    <rect class="other" x="98" y="106" width="44.82" height="16"/>
    <rect class="other" x="98" y="132" width="18.03" height="16"/>
    <rect class="other" x="98" y="158" width="9.26" height="16"/>
    <rect class="other" x="98" y="184" width="9.51" height="16"/>
    <g class="mono ink times">
      <text class="lead" x="270" y="92.5">3.7×</text>
      <text x="148.82" y="118.5">1×</text>
      <text x="122.03" y="144.5">0.40×</text>
      <text x="113.26" y="170.5">0.21×</text>
      <text x="113.51" y="196.5">0.21×</text>
    </g>
  </g>

  <g>
    <text class="mono ink title" x="334" y="40">Bulk load</text>
    <text class="sans ink note" x="334" y="60">higher is better</text>
    <line class="base" x1="334.5" y1="76" x2="334.5" y2="204"/>
    <rect class="reel" x="334" y="80" width="166" height="16"/>
    <rect class="other" x="334" y="106" width="91.79" height="16"/>
    <rect class="other" x="334" y="132" width="43.60" height="16"/>
    <rect class="other" x="334" y="158" width="5.66" height="16"/>
    <rect class="other" x="334" y="184" width="4.39" height="16"/>
    <g class="mono ink times">
      <text class="lead" x="506" y="92.5">1.8×</text>
      <text x="431.79" y="118.5">1×</text>
      <text x="383.60" y="144.5">0.48×</text>
      <text x="345.66" y="170.5">0.06×</text>
      <text x="344.39" y="196.5">0.05×</text>
    </g>
  </g>

  <g>
    <text class="mono ink title" x="570" y="40">Write amplification</text>
    <text class="sans ink note" x="570" y="60">lower is better</text>
    <line class="base" x1="570.5" y1="76" x2="570.5" y2="204"/>
    <rect class="reel" x="570" y="80" width="6.72" height="16"/>
    <rect class="other" x="570" y="106" width="10.65" height="16"/>
    <rect class="other" x="570" y="132" width="12.66" height="16"/>
    <rect class="other" x="570" y="158" width="163.37" height="16"/>
    <rect class="other" x="570" y="184" width="166" height="16"/>
    <g class="mono ink times">
      <text class="lead" x="582.72" y="92.5">0.63×</text>
      <text x="586.65" y="118.5">1×</text>
      <text x="588.66" y="144.5">1.2×</text>
      <text x="739.37" y="170.5">15×</text>
      <text x="742" y="196.5">16×</text>
    </g>
  </g>

  <g>
    <text class="mono ink title" x="806" y="40">Peak memory</text>
    <text class="sans ink note" x="806" y="60">lower is better</text>
    <line class="base" x1="806.5" y1="76" x2="806.5" y2="204"/>
    <rect class="reel" x="806" y="80" width="107.21" height="16"/>
    <rect class="other" x="806" y="106" width="144.67" height="16"/>
    <rect class="other" x="806" y="132" width="166" height="16"/>
    <rect class="other" x="806" y="158" width="114.70" height="16"/>
    <rect class="other" x="806" y="184" width="157.35" height="16"/>
    <g class="mono ink times">
      <text class="lead" x="919.21" y="92.5">0.74×</text>
      <text x="956.67" y="118.5">1×</text>
      <text x="978" y="144.5">1.1×</text>
      <text x="926.70" y="170.5">0.79×</text>
      <text x="969.35" y="196.5">1.1×</text>
    </g>
  </g>

  <text class="sans ink note" x="24" y="234">100 B values, 10M records, 8 threads. Ryzen 9 9950X, NVMe, RocksDB 11.8.1, fjall 3.1.10, LMDB through heed 0.22.1, redb 4.3.0, 2026-09-30.</text>
</svg>
