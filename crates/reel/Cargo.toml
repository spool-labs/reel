[package]
name = "tape-reel"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["key-value", "storage", "log-structured", "database", "embedded"]
categories = ["database", "database-implementations", "data-structures", "filesystem"]
description = "A log-structured key-value store: sequential writes, immutable segments, whole-segment reclaim"
exclude = ["tests/"]

[lib]
name = "reel"
path = "src/lib.rs"

[dependencies]
libc.workspace = true
lz4-sys.workspace = true
reel-api.workspace = true
xxhash-rust.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
libc.workspace = true
# the tests reach the hooks whatever the command line says
reel = { package = "tape-reel", path = ".", features = ["test-hooks"] }
reel-sim.workspace = true

[lints]
workspace = true

[[test]]
name = "churn"
path = "tests/churn/main.rs"

[[test]]
name = "steady"
path = "tests/steady/main.rs"
harness = false

[[test]]
name = "budgets"
path = "tests/budgets/main.rs"
harness = false

[[test]]
name = "ring"
path = "tests/ring/main.rs"

[[test]]
name = "cut"
path = "tests/cut/main.rs"

[features]
# lets the sims and the bench set a volume's worker count, which a node's build never reaches
test-hooks = []
